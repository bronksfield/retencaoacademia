<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frequência · Retenção de Alunos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark navbar-app">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html"><i class="bi bi-activity me-1"></i>Retenção</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="alunos.html">Alunos</a></li>
        <li class="nav-item"><a class="nav-link active" href="frequencia.html">Frequência</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Sair</a></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">Frequência</h1>

    <div class="row g-4">
      <div class="col-lg-5">
        <section class="card">
          <div class="card-body">
            <h2 class="h5">Registrar presença</h2>
            <form>
              <div class="mb-3">
                <label class="form-label">Aluno</label>
                <input type="text" class="form-control" placeholder="Digite o nome do aluno">
              </div>
              <div class="row g-2 mb-3">
                <div class="col-7"><label class="form-label">Data</label><input type="date" class="form-control" value="2026-10-20"></div>
                <div class="col-5"><label class="form-label">Horário</label><input type="time" class="form-control" value="07:30"></div>
              </div>
              <button type="button" class="btn btn-primary w-100"><i class="bi bi-check2-circle me-1"></i>Registrar presença</button>
            </form>
          </div>
        </section>
      </div>

      <div class="col-lg-7">
        <section class="card">
          <div class="card-header bg-white"><h2 class="h5 mb-0">Presenças de hoje</h2></div>
          <div class="card-body p-0">
            <table class="table mb-0">
              <thead><tr><th>Horário</th><th>Aluno</th></tr></thead>
              <tbody>
                <tr><td>06:12</td><td>Bruno Almeida</td></tr>
                <tr><td>06:40</td><td>Fernanda Rocha</td></tr>
                <tr><td>07:05</td><td>Lucas Pereira</td></tr>
                <tr><td>07:30</td><td>Mariana Dias</td></tr>
                <tr><td>18:15</td><td>Thiago Martins</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>

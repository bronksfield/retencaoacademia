<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Retenção de Alunos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <div class="tela-acesso mx-auto">
      <div class="text-center mb-4">
        <i class="bi bi-activity fs-1 text-primary" aria-hidden="true"></i>
        <h1 class="h4 mt-2 mb-1">Retenção e Reengajamento de Alunos</h1>
        <p class="text-secondary small mb-0">Acompanhe a frequência e aja antes do afastamento.</p>
      </div>

      <div class="card">
        <div class="card-body p-4">
          <!-- Protótipo: o login ainda não está ligado ao banco. O botão apenas abre o painel. -->
          <form action="dashboard.html">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="gestor@academia.com">
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha">
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
          <p class="small text-secondary text-center mt-3 mb-0">Ainda não tem conta? <a href="#">Criar conta</a></p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>

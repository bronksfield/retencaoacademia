<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aluno · Retenção de Alunos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header class="topbar d-lg-none">
    <a class="marca" href="dashboard.html"><span class="marca-icone"><i class="bi bi-activity"></i></span>Retenção</a>
    <button class="btn btn-suave btn-icone" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-controls="menu" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
  </header>

  <div class="layout">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menu" aria-label="Menu principal">
      <div class="sidebar-conteudo">
        <div class="d-flex justify-content-between align-items-center px-2 pb-4">
          <a class="marca" href="dashboard.html"><span class="marca-icone"><i class="bi bi-activity"></i></span>Retenção</a>
          <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#menu" aria-label="Fechar menu"></button>
        </div>
        <nav class="d-flex flex-column gap-1">
          <a class="menu-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i>Painel</a>
          <a class="menu-link ativo" href="alunos.html"><i class="bi bi-people"></i>Alunos</a>
          <a class="menu-link" href="frequencia.html"><i class="bi bi-calendar-check"></i>Frequência</a>
        </nav>
        <div class="flex-grow-1"></div>
        <div class="usuario">
          <span class="avatar">G</span>
          <div><div class="fw-semibold">Gestor</div><a href="login.html">Sair</a></div>
        </div>
      </div>
    </aside>

    <main class="conteudo">
      <a href="alunos.html" class="d-inline-flex align-items-center gap-1 mb-3 fw-semibold"><i class="bi bi-arrow-left"></i>Voltar para alunos</a>

      <div id="cabecalho" class="mb-4"><p class="vazio mb-0">Carregando…</p></div>

      <div class="row g-3" id="detalhes" hidden>
        <div class="col-lg-7">
          <section class="card h-100">
            <div class="card-body">
              <h2 class="card-titulo mb-1">Histórico de presenças</h2>
              <p class="small text-secondary">Presenças por semana nas últimas 8 semanas</p>
              <div class="grafico"><canvas id="grafico-historico" aria-label="Gráfico de presenças por semana" role="img"></canvas></div>
              <p class="small text-secondary mt-3 mb-0" id="ultima-presenca"></p>
            </div>
          </section>
        </div>

        <div class="col-lg-5">
          <section class="card h-100">
            <div class="card-body">
              <h2 class="card-titulo mb-1">Intervenções</h2>
              <p class="small text-secondary">Registro de contatos com o aluno — em desenvolvimento.</p>
              <form>
                <fieldset disabled class="d-flex flex-column gap-3">
                  <div>
                    <label for="i-tipo" class="form-label">Tipo de contato</label>
                    <select class="form-select" id="i-tipo">
                      <option>Mensagem</option>
                      <option>Ligação</option>
                      <option>Conversa presencial</option>
                    </select>
                  </div>
                  <div>
                    <label for="i-descricao" class="form-label">O que foi feito</label>
                    <textarea class="form-control" id="i-descricao" rows="3"></textarea>
                  </div>
                  <div class="text-end"><button type="button" class="btn btn-primary">Registrar</button></div>
                </fieldset>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="js/api.js"></script>
  <script src="js/aluno.js"></script>
</body>
</html>

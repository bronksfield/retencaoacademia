<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alunos · Retenção de Alunos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header class="topbar d-lg-none">
    <a class="marca" href="dashboard.html"><span class="marca-icone"><i class="bi bi-activity"></i></span>Retenção</a>
    <button class="btn btn-suave btn-icone" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-controls="menu" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
  </header>

  <div class="layout">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menu" aria-label="Menu principal">
      <div class="sidebar-conteudo">
        <div class="d-flex justify-content-between align-items-center px-2 pb-4">
          <a class="marca" href="dashboard.html"><span class="marca-icone"><i class="bi bi-activity"></i></span>Retenção</a>
          <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#menu" aria-label="Fechar menu"></button>
        </div>
        <nav class="d-flex flex-column gap-1">
          <a class="menu-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i>Painel</a>
          <a class="menu-link ativo" href="alunos.html" aria-current="page"><i class="bi bi-people"></i>Alunos</a>
          <a class="menu-link" href="frequencia.html"><i class="bi bi-calendar-check"></i>Frequência</a>
        </nav>
        <div class="flex-grow-1"></div>
        <div class="usuario">
          <span class="avatar">G</span>
          <div><div class="fw-semibold">Gestor</div><a href="login.html">Sair</a></div>
        </div>
      </div>
    </aside>

    <main class="conteudo">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 class="titulo">Alunos</h1>
          <p class="text-secondary mb-0">Busque, filtre e cadastre os alunos da academia.</p>
        </div>
        <button type="button" class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#novo-aluno" aria-expanded="false" aria-controls="novo-aluno">
          <i class="bi bi-person-plus me-1"></i>Novo aluno
        </button>
      </div>

      <div class="collapse mb-3" id="novo-aluno">
        <section class="card">
          <div class="card-body">
            <h2 class="card-titulo">Cadastrar aluno</h2>
            <form id="form-aluno" class="row g-3">
              <div class="col-md-6">
                <label for="a-nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="a-nome" required>
              </div>
              <div class="col-md-6">
                <label for="a-email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="a-email">
              </div>
              <div class="col-sm-6 col-md-4">
                <label for="a-telefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="a-telefone" placeholder="75999990000">
              </div>
              <div class="col-sm-6 col-md-4">
                <label for="a-plano" class="form-label">Plano</label>
                <select class="form-select" id="a-plano"><option value="">Sem plano</option></select>
              </div>
              <div class="col-md-4">
                <label for="a-matricula" class="form-label">Data de matrícula</label>
                <input type="date" class="form-control" id="a-matricula" required>
              </div>
              <div class="col-12 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-suave" data-bs-toggle="collapse" data-bs-target="#novo-aluno">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
              </div>
            </form>
            <div id="mensagem-form" class="mt-3"></div>
          </div>
        </section>
      </div>

      <section class="card">
        <div class="card-body">
          <div class="row g-2 mb-3">
            <div class="col-sm-8">
              <label for="busca" class="visually-hidden">Buscar por nome ou e-mail</label>
              <div class="position-relative">
                <i class="bi bi-search position-absolute top-50 translate-middle-y text-secondary" style="left: 14px" aria-hidden="true"></i>
                <input type="search" class="form-control ps-5" id="busca" placeholder="Buscar por nome ou e-mail">
              </div>
            </div>
            <div class="col-sm-4">
              <label for="filtro-status" class="visually-hidden">Status</label>
              <select class="form-select" id="filtro-status">
                <option value="">Todos os status</option>
                <option value="ativo" selected>Ativos</option>
                <option value="inativo">Inativos</option>
                <option value="cancelado">Cancelados</option>
              </select>
            </div>
          </div>
          <div id="lista"><p class="vazio mb-0">Carregando…</p></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/alunos.js"></script>
</body>
</html>

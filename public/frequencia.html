<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frequência · Retenção de Alunos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header class="topbar d-lg-none">
    <a class="marca" href="dashboard.html"><span class="marca-icone"><i class="bi bi-activity"></i></span>Retenção</a>
    <button class="btn btn-suave btn-icone" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-controls="menu" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
  </header>

  <div class="layout">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menu" aria-label="Menu principal">
      <div class="sidebar-conteudo">
        <div class="d-flex justify-content-between align-items-center px-2 pb-4">
          <a class="marca" href="dashboard.html"><span class="marca-icone"><i class="bi bi-activity"></i></span>Retenção</a>
          <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#menu" aria-label="Fechar menu"></button>
        </div>
        <nav class="d-flex flex-column gap-1">
          <a class="menu-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i>Painel</a>
          <a class="menu-link" href="alunos.html"><i class="bi bi-people"></i>Alunos</a>
          <a class="menu-link ativo" href="frequencia.html" aria-current="page"><i class="bi bi-calendar-check"></i>Frequência</a>
        </nav>
        <div class="flex-grow-1"></div>
        <div class="usuario">
          <span class="avatar">G</span>
          <div><div class="fw-semibold">Gestor</div><a href="login.html">Sair</a></div>
        </div>
      </div>
    </aside>

    <main class="conteudo">
      <div class="mb-4">
        <h1 class="titulo">Frequência</h1>
        <p class="text-secondary mb-0">Registre a chegada dos alunos e consulte as presenças de cada dia.</p>
      </div>

      <div class="row g-3">
        <div class="col-lg-5">
          <section class="card">
            <div class="card-body">
              <h2 class="card-titulo">Registrar presença</h2>
              <form id="form-presenca" class="d-flex flex-column gap-3">
                <div>
                  <label for="p-aluno" class="form-label">Aluno</label>
                  <select class="form-select" id="p-aluno" required>
                    <option value="">Selecione o aluno</option>
                  </select>
                </div>
                <div class="row g-2">
                  <div class="col-7"><label for="p-data" class="form-label">Data</label><input type="date" class="form-control" id="p-data" required></div>
                  <div class="col-5"><label for="p-hora" class="form-label">Horário</label><input type="time" class="form-control" id="p-hora" required></div>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check2-circle me-1"></i>Registrar presença</button>
              </form>
              <div id="mensagem" class="mt-3"></div>
            </div>
          </section>
        </div>

        <div class="col-lg-7">
          <section class="card">
            <div class="card-body">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h2 class="card-titulo mb-0">Presenças do dia</h2>
                <div>
                  <label for="consulta-dia" class="visually-hidden">Dia</label>
                  <input type="date" class="form-control" id="consulta-dia">
                </div>
              </div>
              <div id="lista"><p class="vazio mb-0">Carregando…</p></div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/frequencia.js"></script>
</body>
</html>

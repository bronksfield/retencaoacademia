<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Retenção de Alunos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="tela-acesso">
    <div class="text-center mb-4">
      <span class="marca-icone mx-auto mb-3" style="width: 56px; height: 56px; border-radius: 18px; font-size: 1.6rem"><i class="bi bi-activity"></i></span>
      <h1 class="titulo">Retenção de Alunos</h1>
      <p class="text-secondary mb-0">Acompanhe a frequência e aja antes do afastamento.</p>
    </div>

    <section class="card">
      <div class="card-body p-4">
        <form action="dashboard.html" class="d-flex flex-column gap-3">
          <div>
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="gestor@academia.com" autocomplete="email">
          </div>
          <div>
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="small text-secondary text-center mt-3 mb-0">Ainda não tem conta? <a href="#" class="fw-semibold">Criar conta</a></p>
      </div>
    </section>
  </main>
</body>
</html>
